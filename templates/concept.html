<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>concept</title>
  <link rel="stylesheet" href="card-base.css" />
  <style>
    .page { --accent: {{ACCENT}}; }
    .char { height: 52%; right: -30px; bottom: 90px; }
    .main { margin-top: 36px; max-width: 64%; }
    .keyword {
      margin-top: 28px;
      display: inline-block;
      background: var(--accent);
      color: #fff8ee;
      padding: 14px 22px;
      font-size: 40px;
      font-weight: 900;
      border: 4px solid var(--frame);
    }
  </style>
</head>
<body>
  <article class="page">
    <div class="dotgrid"></div>
    <div class="en-title">{{EN_TITLE}}</div>
    <h1 class="zh-title">{{ZH_TITLE}}</h1>
    <p class="sub">{{SUB}}</p>
    <div class="keyword">{{KEYWORD}}</div>
    <div class="block main">
      {{ITEMS}}
    </div>
    <img class="char" src="{{CHAR_IMG}}" alt="" />
    <div class="watermark">{{WATERMARK}}</div>
  </article>
</body>
</html>
