<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>pain</title>
  <link rel="stylesheet" href="card-base.css" />
  <style>
    .page { --accent: {{ACCENT}}; }
    .char { left: -80px; right: auto; height: 58%; bottom: 80px; transform: scaleX(-1); }
    .main { margin-top: 40px; max-width: 68%; margin-left: auto; }
  </style>
</head>
<body>
  <article class="page">
    <div class="dotgrid"></div>
    <h1 class="zh-title">{{ZH_TITLE}}</h1>
    <p class="sub">{{SUB}}</p>
    <div class="block main">
      <h2>卡住的地方</h2>
      {{ITEMS}}
    </div>
    <img class="char" src="{{CHAR_IMG}}" alt="" />
    <div class="watermark">{{WATERMARK}}</div>
  </article>
</body>
</html>
